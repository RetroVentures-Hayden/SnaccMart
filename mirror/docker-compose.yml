# Auto-updating SnaccMart mirror for a home server (e.g. ZimaOS).
#
# Deploy: in ZimaOS, add a custom app from this compose, or run:
#   docker compose -f mirror/docker-compose.yml up -d --build
#
# Then:
#   - Web catalog:  http://<host>:8080/
#   - Machine feed: http://<host>:8080/catalog/catalog.tsv
#
# Point the on-console client at this mirror by writing that catalog.tsv URL to
# sdmc:/switch/homebrew-store/catalog_url.txt on the console's SD card.

services:
  snaccmart-mirror:
    build: .
    image: snaccmart-mirror:local
    container_name: snaccmart-mirror
    ports:
      - "8080:8080"
    environment:
      REPO_URL: "https://github.com/RetroVentures-Hayden/SnaccMart"
      BRANCH: "main"
      INTERVAL: "300"   # seconds between git pulls
      PORT: "8080"
    volumes:
      - snaccmart-mirror-data:/srv/snaccmart
    restart: unless-stopped

volumes:
  snaccmart-mirror-data:
